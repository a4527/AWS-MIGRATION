plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Security patch overrides for Trivy HIGH/CRITICAL findings (CICD-01).
// Spring Boot 3.5 manages these; raise only the patch level. Remove an entry
// once the Boot BOM catches up.
ext['tomcat.version'] = '10.1.62'
ext['netty.version'] = '4.1.141.Final'
ext['jackson-bom.version'] = '2.21.8'
ext['postgresql.version'] = '42.7.14'
ext['httpcore5.version'] = '5.4.4'
// AWS SDK apache5-client is built against httpclient5 5.6.x; Boot 3.5 would pin 5.5.
ext['httpclient5.version'] = '5.6.4'

// Transitive dependencies of minio that Spring Boot does not manage.
dependencyManagement {
    dependencies {
        dependency 'org.bouncycastle:bcprov-jdk18on:1.87'
        dependency 'com.google.guava:guava:33.8.0-jre'
        dependency 'org.xerial.snappy:snappy-java:1.1.10.12'
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.minio:minio:8.6.0'
    implementation 'software.amazon.awssdk:s3:2.59.5'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
