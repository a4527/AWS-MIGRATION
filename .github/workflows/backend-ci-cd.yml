name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
      - ".trivyignore.yaml"
  # DEC-015: a push to main that passes test and scan deploys automatically.
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
      - ".trivyignore.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fileshare-dev-backend
  ECS_CLUSTER: fileshare-dev-ecs
  ECS_SERVICE: fileshare-dev-backend
  ECS_CONTAINER_NAME: backend
  AURORA_CLUSTER: fileshare-dev-aurora
  CI_IMAGE: fileshare-backend:${{ github.sha }}

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test backend
        working-directory: backend
        run: ./gradlew test --no-daemon

  image:
    name: Build and scan backend image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build -t "$CI_IMAGE" ./backend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          scanners: vuln
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          # Reviewed exceptions with expiry dates (CICD-01). Expired entries block again.
          trivyignores: .trivyignore.yaml

      - name: Save verified image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: docker save "$CI_IMAGE" -o backend-image.tar

      - name: Upload verified image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy:
    name: Push image and deploy ECS service
    runs-on: ubuntu-latest
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # One deployment at a time; a newer push waits instead of cancelling a rollout.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified image
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Load verified image
        run: docker load -i backend-image.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push verified backend image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$CI_IMAGE" "$IMAGE_URI"
          docker push "$IMAGE_URI"
          # latest = last image that passed test and scan on main. A recreated
          # lab layer starts from it (Terraform template tag, DEC-015).
          docker tag "$CI_IMAGE" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # The application layer (ECS) exists only during labs. When it is down the
      # image stays in ECR and the run succeeds without deploying.
      - name: Check application layer
        id: target
        run: |
          STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].status" --output text 2>/dev/null || echo MISSING)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ECS service $ECS_SERVICE is not active ($STATUS). Image pushed; deployment skipped."
            echo "Deployment skipped: application layer is down (service status: $STATUS). Image pushed to ECR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RUNNING=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].runningCount" --output text)
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "running=$RUNNING" >> "$GITHUB_OUTPUT"

      # DEC-010: with no running task Aurora may be paused at 0 ACU and the first
      # task would exit before it resumes. Listing the writer's log files resumes it.
      - name: Wake Aurora before the first task
        if: steps.target.outputs.deploy == 'true' && steps.target.outputs.running == '0'
        run: |
          WRITER=$(aws rds describe-db-clusters --db-cluster-identifier "$AURORA_CLUSTER" \
            --query 'DBClusters[0].DBClusterMembers[?IsClusterWriter].DBInstanceIdentifier' --output text)
          aws rds describe-db-log-files --db-instance-identifier "$WRITER" --query 'length(DescribeDBLogFiles)'
          sleep 30
          aws rds describe-events --source-type db-instance --source-identifier "$WRITER" --duration 10 \
            --query 'Events[].[Date,Message]' --output text

      - name: Read current ECS task definition
        if: steps.target.outputs.deploy == 'true'
        run: |
          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].taskDefinition" \
            --output text)

          # Keep the current revision's tags (Owner is required by the account
          # cleanup policy) so the new revision registers with the same tags.
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --include TAGS \
            --output json \
            | jq '.taskDefinition + {tags: (.tags // [])}' \
            > task-definition.json

          if ! jq -e '.tags | any(.key == "Owner" and (.value | length > 0))' task-definition.json > /dev/null; then
            echo "::error::Current task definition has no Owner tag; refusing to register an untagged revision."
            exit 1
          fi

      - name: Render ECS task definition
        if: steps.target.outputs.deploy == 'true'
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image_uri }}

      - name: Deploy ECS service
        if: steps.target.outputs.deploy == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
