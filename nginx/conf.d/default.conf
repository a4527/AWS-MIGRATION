upstream file_share_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://file_share_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 로컬 수동 테스트 페이지(nginx/test-ui). AWS(ALB)에는 배포되지 않는다.
    absolute_redirect off;   # 컨테이너 포트(80) 대신 브라우저가 쓴 포트(8080)를 유지한다
    location = /test { return 302 /test/; }
    location /test/ {
        alias /usr/share/nginx/test-ui/;
        index index.html;
    }

    location /actuator/health {
        proxy_pass http://file_share_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
